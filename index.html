<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>꼬마 요리사의 식탁</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <header class="game-header">
      <p class="game-description">음식을 누르면 설명이 나와요.</p>
    </header>

    <section class="food-tray" id="foodTray" aria-label="음식 선택"></section>

    <section class="table-section" aria-label="식탁">
      <div class="dining-table">
        <div class="table-top">
          <div class="table-utensils table-utensils-left" aria-hidden="true">
            <svg class="utensil utensil-spoon" viewBox="0 0 36 72" role="img" aria-label="숟가락">
              <ellipse cx="18" cy="14" rx="11" ry="13" fill="#e8e8e8" stroke="#a8a8a8" stroke-width="1.5"/>
              <rect x="15" y="25" width="6" height="42" rx="3" fill="#d0d0d0" stroke="#a8a8a8" stroke-width="1"/>
            </svg>
            <svg class="utensil utensil-chopsticks" viewBox="0 0 44 72" role="img" aria-label="젓가락">
              <rect x="10" y="6" width="5" height="58" rx="2.5" fill="#d9a066" stroke="#b8783a" stroke-width="1"/>
              <rect x="29" y="6" width="5" height="58" rx="2.5" fill="#d9a066" stroke="#b8783a" stroke-width="1"/>
            </svg>
          </div>
          <div class="drop-zones">
            <div class="drop-zone" data-slot="0"></div>
            <div class="drop-zone" data-slot="1"></div>
            <div class="drop-zone" data-slot="2"></div>
            <div class="drop-zone" data-slot="3"></div>
          </div>
          <div class="table-utensils table-utensils-right" aria-hidden="true">
            <svg class="utensil utensil-fork" viewBox="0 0 36 72" role="img" aria-label="포크">
              <path d="M10 4 V22 M18 4 V22 M26 4 V22" fill="none" stroke="#c8c8c8" stroke-width="3.5" stroke-linecap="round"/>
              <rect x="13" y="20" width="10" height="46" rx="4" fill="#d0d0d0" stroke="#a8a8a8" stroke-width="1"/>
            </svg>
            <svg class="utensil utensil-knife" viewBox="0 0 36 72" role="img" aria-label="나이프">
              <rect x="13" y="40" width="10" height="28" rx="4" fill="#d0d0d0" stroke="#a8a8a8" stroke-width="1"/>
              <path d="M11 40 C8 28 8 16 11 8 C13 4 17 3 19 3 Q 22 3.5 25 3 L25 40 Z" fill="#e8e8e8" stroke="#a8a8a8" stroke-width="1.2" stroke-linejoin="round"/>
            </svg>
            <svg class="utensil utensil-spoon" viewBox="0 0 36 72" role="img" aria-label="숟가락">
              <ellipse cx="18" cy="14" rx="11" ry="13" fill="#e8e8e8" stroke="#a8a8a8" stroke-width="1.5"/>
              <rect x="15" y="25" width="6" height="42" rx="3" fill="#d0d0d0" stroke="#a8a8a8" stroke-width="1"/>
            </svg>
          </div>
        </div>
      </div>
    </section>

    <button class="restart-btn" id="restartBtn" type="button" hidden aria-label="다시 하기">
      <svg class="restart-icon" viewBox="0 0 64 64" aria-hidden="true">
        <path d="M49 18.5C44.2 13.2 37.2 10 29.5 10 17.4 10 7.5 19.9 7.5 32S17.4 54 29.5 54c10.8 0 20-7.2 22.8-17.2" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round"/>
        <path d="M49 10v12h-12" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="restart-label">다시 하기</span>
    </button>
  </div>

  <div class="drag-ghost" id="dragGhost" aria-hidden="true"></div>

  <script src="script.js"></script>
</body>
</html>
